<body>

    <!-- Cabeçalho -->
    <header class="main-header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-heart"></i></div>
                <div class="logo-text">
                    <h1>Amora Artesanal</h1>
                    <span>Presentes e Produtos Feitos à Mão</span>
                </div>
            </a>

            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Início</a></li>
                <li><a href="produtos.html" class="nav-link">Produtos</a></li>
                <li><a href="pedidos.html" class="nav-link">Rastreamento</a></li>
                <li><a href="contato.html" class="nav-link">Fale Conosco</a></li>
            </ul>

            <div class="nav-actions">
                <div class="user-nav-area"></div>
                <a href="carrinho.html" class="cart-btn" title="Sacola de Compras">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-badge" style="display: none;">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container" style="margin: 40px auto 70px; max-width: 520px;">
        <div class="auth-wrapper" style="max-width: 100%;">
            <div class="auth-header" style="text-align: center; margin-bottom: 24px;">
                <div style="width: 56px; height: 56px; background: var(--cor-rosa-claro); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; color: var(--cor-rosa-queimado); font-size: 1.4rem;">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2>Acesse sua Conta</h2>
                <p>Informe suas credenciais para gerenciar seus pedidos e rastreamento</p>
            </div>

            <div id="alerta-login" style="display: none; margin-bottom: 18px;"></div>

            <!-- Formulário de Login Seguro sem Dados Pré-Preenchidos -->
            <form id="form-login" onsubmit="fazerLogin(event)">
                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="login-email" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--cor-marrom-texto);">Endereço de E-mail *</label>
                    <input type="email" id="login-email" class="form-control" placeholder="Digite seu e-mail" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 22px;">
                    <label for="login-senha" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--cor-marrom-texto);">Senha de Acesso *</label>
                    <input type="password" id="login-senha" class="form-control" maxlength="32" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 16px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar na Loja
                </button>
            </form>

            <div class="auth-footer" style="text-align: center; border-top: 1px solid var(--cor-borda); padding-top: 18px; margin-top: 18px;">
                <p style="font-size: 0.88rem; color: var(--cor-marrom-claro);">
                    Ainda não tem conta? <a href="cadastro.html" style="color: var(--cor-rosa-queimado); font-weight: 700;">Criar uma conta gratuita</a>
                </p>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Amora Artesanal. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/amora-store.js"></script>

        function fazerLogin(e) {
            e.preventDefault();
            var email = document.getElementById('login-email').value.trim().toLowerCase();
            var senha = document.getElementById('login-senha').value;
            var alerta = document.getElementById('alerta-login');

            alerta.style.display = 'none';

            // 1. Verifica contas pré-configuradas do ateliê
            if (USUARIOS_AUTORIZADOS[email]) {
                if (USUARIOS_AUTORIZADOS[email].senha === senha) {
                    var user = USUARIOS_AUTORIZADOS[email].dados;
                    window.AmoraStore.setUser(user);
                    window.AmoraStore.showToast('Login efetuado com sucesso!', 'Bem-vindo(a), ' + user.nome);
                    setTimeout(function() {
                        window.location.href = 'pedidos.html';
                    }, 400);
                    return;
                } else {
                    alerta.style.display = 'block';
                    alerta.className = 'alert alert-danger';
                    alerta.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Senha incorreta para o e-mail informado.';
                    return;
                }
            }

            // 2. Verifica usuários cadastrados localmente
            try {
                var cadastrados = localStorage.getItem('amora_usuarios_cadastrados');
                if (cadastrados) {
                    var lista = JSON.parse(cadastrados);
                    var achou = lista.find(function(u) { return u.email.toLowerCase() === email; });
                    if (achou) {
                        if (achou.senha === senha) {
                            window.AmoraStore.setUser(achou.dados);
                            window.AmoraStore.showToast('Login efetuado com sucesso!', 'Bem-vindo(a), ' + achou.dados.nome);
                            setTimeout(function() {
                                window.location.href = 'pedidos.html';
                            }, 400);
                            return;
                        } else {
                            alerta.style.display = 'block';
                            alerta.className = 'alert alert-danger';
                            alerta.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Senha incorreta para a conta informada.';
                            return;
                        }
                    }
                }
            } catch (err) {}

            // Se não encontrou o e-mail
            alerta.style.display = 'block';
            alerta.className = 'alert alert-danger';
            alerta.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Usuário não encontrado. Verifique o e-mail ou crie uma conta.';
        }
    </script>
